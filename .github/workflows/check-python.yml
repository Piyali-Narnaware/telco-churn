name: Check churn pipeline source
on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/check-python.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q src scripts
